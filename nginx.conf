worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include mime.types;

  # Timeout settings
  send_timeout 60s;
  client_body_timeout 60s;
  client_header_timeout 60s;
  keepalive_timeout 65s;

  # $request_port is empty when the request has no explicit port in the
  # request-line authority or Host header (e.g. plain HTTP requests to the
  # default port 80), so allow that case and explicit port 80 alongside the
  # HTTPS CONNECT ports below.
  map $request_port $allow_port {
      ""             1;
      80             1;
      443            1;
      563            1;
  }

  # map $host $allow_host {
  #     hostnames;

  #     example.org    1;
  #     *.example.org  1;
  # }

  server {
    listen 3128;

    access_log /dev/stdout;
    error_log  /dev/stderr;

    resolver 1.1.1.1 ipv6=off valid=5s;

    if ($allow_port != 1) {
        return 502;
    }

    # if ($allow_host != 1) {
    #     return 502;
    # }

    location / {
      # HTTPS forward proxying (CONNECT tunnel)
      if ($request_method = CONNECT) {
          tunnel_pass;
      }

      # Plain HTTP (port 80) forward proxying
      proxy_pass http://$host$request_uri;
      proxy_set_header Host $host;
      proxy_http_version 1.1;
      proxy_connect_timeout 60s;
      proxy_send_timeout 60s;
      proxy_read_timeout 60s;
    }
  }
}
